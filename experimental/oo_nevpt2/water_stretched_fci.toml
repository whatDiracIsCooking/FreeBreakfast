# water_fci.toml with both O-H bonds stretched to 1.8 times their length:
# the (4,4) space now carries real static correlation.
[molecule]
xyz = "water_stretched.xyz"
[basis_set]
basis = "6-31g"
[eri]
mode = "density_fitting"
aux_basis = "def2-universal-jkfit"
[scf]
energy_tolerance = 1e-12
commutator_tolerance = 1e-10
[casscf]
ncas = 4
nelecas = 4
conv_tol = 1e-12
conv_tol_grad = 1e-9
[fci]

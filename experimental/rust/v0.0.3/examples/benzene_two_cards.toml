# Benzene in cc-pVDZ over cc-pVDZ-JKFIT on two logical cards, both on
# device 0, with limits that force several batches: the multi-card path
# (lock order, a scratch slab per card, the reduction onto gpu0) on a
# one-card box. Not a multi-GPU run.

[molecule]
xyz = "../../../../rust/pipeline/scf/tests/data/benzene.xyz"

[basis]
name = "cc-pvdz"

[eri]
aux_basis = "cc-pvdz-jkfit"
limit_mib = 9.5

[guess]

[jk]
limit_mib = 42.7

[resources]
devices = [0, 0]
threads = 4
nan_fill = true

[package]
name = "fb-df-batched-single-gpu"
version = "0.1.0"
edition = "2024"
publish = false
description = "Batched DF factor B on one GPU: a driver and benchmark over rust/'s add_packed_b"

[[bin]]
name = "df-batched"
path = "src/main.rs"

# rust/'s crates, by path: the build under study is theirs, unchanged
# (fb_integrals_eri_density_fitting_three_center::add_packed_b). Nothing of
# it is copied here.
[dependencies]
fb-basis = { path = "../../../../rust/basis" }
fb-core-arena = { path = "../../../../rust/core/arena", features = ["device"] }
fb-core-error-handling = { path = "../../../../rust/core/error_handling" }
fb-core-planner = { path = "../../../../rust/core/planner" }
fb-core-thread-pool = { path = "../../../../rust/core/thread_pool", features = ["device"] }
fb-integrals-eri-density-fitting-metric = { path = "../../../../rust/integrals/eri/density_fitting/metric" }
fb-integrals-eri-density-fitting-pair-map = { path = "../../../../rust/integrals/eri/density_fitting/pair_map" }
fb-integrals-eri-density-fitting-three-center = { path = "../../../../rust/integrals/eri/density_fitting/three_center" }
fb-integrals-mmd = { path = "../../../../rust/integrals/mmd" }
fb-integrals-schwarz = { path = "../../../../rust/integrals/schwarz" }
fb-io-basis = { path = "../../../../rust/io/basis" }
fb-io-xyz = { path = "../../../../rust/io/xyz" }
fb-recipes-cholesky = { path = "../../../../rust/recipes/cholesky" }
serde_json = "1"

[package]
name = "fb-df-batched-single-gpu-spherical"
version = "0.1.0"
edition = "2024"
publish = false
description = "Batched DF factor B on one GPU over FelizJueves's fully spherical ssperi3 kernels, with no spherical transform"

[[bin]]
name = "df-batched-spherical"
path = "src/main.rs"

# rust/'s crates, by path. The build loop is forked in src/ssperi3.rs (the
# kernels and the cells change, and the transform goes); rust/'s
# add_packed_b is linked too, as the baseline the driver checks B against
# and can time instead (--baseline).
[dependencies]
fb-basis = { path = "../../../../rust/basis" }
fb-core-arena = { path = "../../../../rust/core/arena", features = ["device"] }
fb-core-error-handling = { path = "../../../../rust/core/error_handling" }
fb-core-planner = { path = "../../../../rust/core/planner" }
fb-core-thread-pool = { path = "../../../../rust/core/thread_pool", features = ["device"] }
fb-core-wwr = { path = "../../../../rust/core/wwr" }
fb-integrals-eri-density-fitting-fit = { path = "../../../../rust/integrals/eri/density_fitting/fit" }
fb-integrals-eri-density-fitting-metric = { path = "../../../../rust/integrals/eri/density_fitting/metric" }
fb-integrals-eri-density-fitting-pair-map = { path = "../../../../rust/integrals/eri/density_fitting/pair_map" }
fb-integrals-eri-density-fitting-three-center = { path = "../../../../rust/integrals/eri/density_fitting/three_center" }
fb-integrals-mmd = { path = "../../../../rust/integrals/mmd" }
fb-integrals-schwarz = { path = "../../../../rust/integrals/schwarz" }
fb-integrals-sys = { path = "../../../../rust/integrals/sys" }
fb-io-basis = { path = "../../../../rust/io/basis" }
fb-io-xyz = { path = "../../../../rust/io/xyz" }
fb-recipes-cholesky = { path = "../../../../rust/recipes/cholesky" }
serde_json = "1"
wwr-sys = { path = "../../../../deps/WarpWraps/src/capi/wwr-sys", default-features = false, features = ["runtime_api", "blas"] }

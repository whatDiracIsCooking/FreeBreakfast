[package]
name = "fb-v-potential-en-host"
version = "0.1.0"
edition = "2024"
publish = false
description = "The spherical AO nuclear-attraction matrix V computed on the host, in Rust"

[lib]
name = "fb_v_potential_en_host"
path = "src/lib.rs"

[[bin]]
name = "v-potential-en-host"
path = "src/main.rs"

# The rebuild's device-free crates: the molecule, the basis and its
# spherical layout, and the .npy reader and writer. None links wwr. The Boys
# function is the sibling DF metric's: the C++ tree's eval_boys, ported.
[dependencies]
fb-basis = { path = "../../../rust/basis" }
fb-core-primitives = { path = "../../../rust/core/primitives" }
fb-df-metric-host = { path = "../df_metric" }
fb-io-basis = { path = "../../../rust/io/basis" }
fb-io-npy = { path = "../../../rust/io/npy" }
fb-io-xyz = { path = "../../../rust/io/xyz" }
fb-molecule = { path = "../../../rust/molecule" }
rayon = "1"

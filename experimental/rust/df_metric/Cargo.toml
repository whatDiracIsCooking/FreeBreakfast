[package]
name = "fb-df-metric-host"
version = "0.1.0"
edition = "2024"
publish = false
description = "The density-fitting Coulomb metric (P|Q) computed on the host, in Rust"

[lib]
name = "fb_df_metric_host"
path = "src/lib.rs"

[[bin]]
name = "df-metric-host"
path = "src/main.rs"

# The rebuild's device-free crates: the molecule, the fitting set and its
# spherical layout, and the .npy reader and writer. None links wwr.
[dependencies]
fb-basis = { path = "../../../rust/basis" }
fb-core-primitives = { path = "../../../rust/core/primitives" }
fb-io-basis = { path = "../../../rust/io/basis" }
fb-io-npy = { path = "../../../rust/io/npy" }
fb-io-xyz = { path = "../../../rust/io/xyz" }
libm = "0.2.16"
rayon = "1"

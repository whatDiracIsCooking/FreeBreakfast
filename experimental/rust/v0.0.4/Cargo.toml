[package]
name = "fb-v04"
version = "0.4.0"
edition = "2024"
publish = false
description = "Prototype of the rustflow redesign: the DF-RHF chain as steps on num_gpus GPUs, batched, from scratch over the C ABI"

# A workspace of its own: rust/'s lints and lock do not apply to a prototype,
# and rust/'s gates never see it. Cargo is run by hand (README.md, "Build and run").
[workspace]

[lib]
name = "fb_v04"
path = "src/lib.rs"

[dependencies]
rustflow = { git = "https://github.com/whatDiracIsCooking/rustflow", rev = "f184bcabac5ab01dec0def8c3f369d1bbdb3bbaf" }
log = { version = "0.4", features = ["std"] }
serde = { version = "1", features = ["derive"] }
toml = "1"

# The C ABI: wwr's, and the kernel libraries' extern declarations.
wwr-sys = { path = "../../../deps/WarpWraps/src/capi/wwr-sys", default-features = false, features = [
    "runtime_api",
    "blas",
    "solver",
] }
fb-kernel-abi = { path = "../../../rust/kernel_abi" }
fb-recipes-sys = { path = "../../../rust/recipes/sys" }
fb-integrals-sys = { path = "../../../rust/integrals/sys" }

# The device-free crates.
fb-core-error-handling = { path = "../../../rust/core/error_handling" }
fb-basis = { path = "../../../rust/basis" }
fb-molecule = { path = "../../../rust/molecule" }
fb-io-basis = { path = "../../../rust/io/basis" }
fb-io-xyz = { path = "../../../rust/io/xyz" }
fb-io-sad = { path = "../../../rust/io/sad" }
fb-sad = { path = "../../../rust/sad" }

# The host steps' integrals: the experiments' library crates, device-free.
fb-s-overlap-host = { path = "../s_overlap_host" }
fb-t-kinetic-host = { path = "../t_kinetic_host" }
fb-v-potential-en-host = { path = "../v_potential_en_host" }
fb-df-metric-host = { path = "../df_metric" }

# The atomic SCF behind a SAD stamp is slow unoptimized (rust/Cargo.toml).
[profile.dev.package.fb-sad]
opt-level = 3

# The host integrals run on every test.
[profile.dev.package.fb-s-overlap-host]
opt-level = 3
[profile.dev.package.fb-t-kinetic-host]
opt-level = 3
[profile.dev.package.fb-v-potential-en-host]
opt-level = 3
[profile.dev.package.fb-df-metric-host]
opt-level = 3

[package]
name = "fb-t-kinetic-host"
version = "0.1.0"
edition = "2024"
publish = false
description = "The spherical AO kinetic energy T computed on the host, in Rust"

[lib]
name = "fb_t_kinetic_host"
path = "src/lib.rs"

[[bin]]
name = "t-kinetic-host"
path = "src/main.rs"

# The rebuild's device-free crates: the molecule, the basis and its
# spherical layout, and the .npy reader and writer. None links wwr.
[dependencies]
fb-basis = { path = "../../../rust/basis" }
fb-core-primitives = { path = "../../../rust/core/primitives" }
fb-io-basis = { path = "../../../rust/io/basis" }
fb-io-npy = { path = "../../../rust/io/npy" }
fb-io-xyz = { path = "../../../rust/io/xyz" }
rayon = "1"

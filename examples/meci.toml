# The S0/S1 minimum-energy conical intersection of ethylene's state-averaged
# DF-CASSCF(2,2) in cc-pVDZ, from a start twisted 80 degrees and
# pyramidalized (test/gtest/data/casscf_meci/'s). Writes optimize.xyz,
# optimize.json and final.xyz, then the CASSCF at the MECI.
[molecule]
xyz = "ethylene.xyz"
[basis_set]
basis = "cc-pvdz"
[eri]
mode = "density_fitting"   # required
aux_basis = "cc-pvdz-jkfit"
[scf]
max_iterations = 400       # the RHF only seeds the CASSCF; near the MECI it is slow
[casscf]
ncas = 2
nelecas = 2
nroots = 2                 # a state average, I and J at equal weights
conv_tol_grad = 1e-9       # g_I, g_J and h_IJ are the CASSCF's only at convergence
[optimize]
meci = [0, 1]              # the two roots that cross
max_gap = 1e-7             # hartree; with Opt=Tight's four thresholds below
max_force = 1.5e-5
rms_force = 1e-5
max_displacement = 6e-5
rms_displacement = 4e-5

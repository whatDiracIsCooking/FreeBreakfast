# SC- and PC-NEVPT2 over casscf.toml's CASSCF(4,4) water. [nevpt2] needs
# density-fitted ERIs; its energies are printed, not written.
[molecule]
xyz = "water.xyz"
[basis_set]
basis = "cc-pvdz"
[eri]
mode = "density_fitting"      # required by [nevpt2]
aux_basis = "cc-pvdz-jkfit"
[casscf]
ncas = 4
nelecas = 4
[nevpt2]                      # quasi_degenerate = false by default

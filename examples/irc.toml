# The intrinsic reaction coordinate of HCN <-> HNC at RHF/STO-3G, from its
# transition state down both sides to HCN and HNC. The Hessian at the TS is
# computed first, numerically over the exact ERIs, and the walk leaves along
# its one imaginary mode. Writes irc.json, irc_forward.xyz and
# irc_backward.xyz, and hessian.json, a start a later run can load with
# [hessian] from = "hessian.json".
[molecule]
xyz = "hcn_ts.xyz"
[basis_set]
basis = "sto-3g"
[scf]
energy_tolerance = 1e-12
commutator_tolerance = 1e-10
fock_rebuild_interval = 1
[hessian]
method = "numerical"       # the analytic one needs [eri] density_fitting
[irc]
step_size = 0.1            # amu^1/2 bohr, the default
direction = "both"         # the default; or "forward", "backward"

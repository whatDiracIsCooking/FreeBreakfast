[package]
name = "fb-recipes-cholesky"
description = "recipes/cholesky: A = L Lᵀ, the tree's own blocked factorization, and its flag check, as tasks"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
contracts.workspace = true
fb-core-arena.workspace = true
fb-core-error-handling.workspace = true
fb-core-planner.workspace = true
fb-core-thread-pool = { workspace = true, features = ["device"] }
fb-core-wwr.workspace = true
fb-recipes-sys.workspace = true
# BLAS for the panel's trsm and the trailing syrk's modes.
wwr-sys = { workspace = true, features = ["blas"] }

[dev-dependencies]
fb-core-arena = { workspace = true, features = ["test-support"] }
fb-io-npy.workspace = true
fb-test-support.workspace = true

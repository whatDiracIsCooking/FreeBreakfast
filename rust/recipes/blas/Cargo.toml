[package]
name = "fb-recipes-blas"
description = "recipes/blas: the sandwich products gemmwich and gmmwich over fb_core_wwr's checked calls, their ops fixed at compile time; a single call is fb_core_wwr::blas's"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
fb-core-error-handling.workspace = true
fb-core-wwr.workspace = true
# BLAS for the operation and side enums, beside the runtime.
wwr-sys = { workspace = true, features = ["blas"] }

[dev-dependencies]
fb-core-wwr = { workspace = true, features = ["test-support"] }
fb-test-support.workspace = true

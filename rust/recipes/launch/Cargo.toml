[package]
name = "fb-recipes-launch"
description = "recipes' safe calls over fb-recipes-sys's launch wrappers, on fb-core-wwr's slices and stream, and the blocked triangular solve"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
contracts.workspace = true
fb-core-error-handling.workspace = true
fb-core-log.workspace = true
# The safe calls' slices, stream and status mapping.
fb-core-wwr.workspace = true
fb-kernel-abi.workspace = true
# The launch wrappers, the tile constants and the load check.
fb-recipes-sys.workspace = true
# BLAS for the triangular solve's side, fill, operation and diagonal enums.
wwr-sys = { workspace = true, features = ["blas"] }

[dev-dependencies]
fb-core-wwr = { workspace = true, features = ["test-support"] }

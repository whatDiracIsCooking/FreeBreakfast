# The closed-shell RHF energy of water in cc-pVDZ over the conventional
# integrals: the whole four-index tensor stored once, packed, and J and K
# one GEMV each, with no fitting set. Exact, for a small basis: at most 150
# Cartesian AOs, shells through d. From the SAD guess. Writes scf.json,
# c.npy, d.npy and timing.json.
calculation = "rhf"
output = "conventional"  # relative to the working directory; default "fbf_output"

[molecule]
xyz = "water.xyz"      # Angstrom, relative to this file

[basis_set]
basis = "cc-pvdz"      # a compiled-in name, or a BSE JSON path relative to this file

[eri]                  # required: no default
mode = "conventional"  # no aux_basis: nothing is fitted

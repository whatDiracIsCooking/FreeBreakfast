# The AO overlap S of water in cc-pVDZ. Writes overlap.npy, budget.txt and
# timing.json into --output (default fbf_output).
calculation = "overlap"   # the overlap step alone

[molecule]
xyz = "water.xyz"      # Angstrom, relative to this file

[basis]
name = "cc-pvdz"       # a compiled-in name, or a BSE JSON path

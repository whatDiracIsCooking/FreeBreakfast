# The DF-RHF of water in cc-pVDZ over cc-pVDZ-JKFIT on two GPUs: B's pair
# batches and each J/K pass's aux batches split across devices 0 and 1, the
# SCF's loop on gpu0. Writes what rhf.toml writes, at its energy. Needs two
# visible devices; setup refuses a device the runtime does not see.
calculation = "rhf"

[molecule]
xyz = "water.xyz"

[basis]
name = "cc-pvdz"

[eri]
aux_basis = "cc-pvdz-jkfit"

[resources]
devices = [0, 1]

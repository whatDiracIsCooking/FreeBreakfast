[package]
name = "fb-core-wwr"
description = "core::wwr: the layer over WarpWraps"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# runtime::tests' device helpers, for a dependent's tests.
test-support = []

[dependencies]
contracts.workspace = true
fb-core-error-handling.workspace = true
fb-core-log.workspace = true
# BLAS and the dense solver for the handles in `blas` and `solver`, beside
# the runtime.
wwr-sys = { workspace = true, features = ["blas", "solver"] }

[package]
name = "fb-core-device"
description = "core::device: the v0.0.4 layer's runtime over wwr-sys: the current device, streams, events, copies, device slices, and a GPU's guarded BLAS and solver handles with the trsm and Cholesky recipes"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
contracts.workspace = true
fb-core-error-handling.workspace = true
# The value checks of the always-on contracts (le!), the panic hook that
# prints their operands, and log_at for a failed destroy.
fb-core-log.workspace = true
# dlsym, to find a linked host OpenBLAS's thread controls
# (single_thread_host_blas).
libc.workspace = true
# The recipes' launch status as a Status.
fb-kernel-abi.workspace = true
# The trsm and Cholesky recipes' diagonal kernels, through the library's raw
# extern declarations alone, wrapped here (docs/gpu_layer.md, "The v0.0.4
# runtime").
fb-recipes-sys.workspace = true
# The runtime, and the guard's BLAS and dense-solver handles.
wwr-sys = { workspace = true, features = ["blas", "solver"] }

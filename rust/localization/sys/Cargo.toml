[package]
name = "fb-localization-sys"
description = "localization's launch wrappers: FFI bindings over libfb_localization_kernels.so, and the Pipek-Mezey tasks that launch them"
version.workspace = true
edition.workspace = true
publish.workspace = true
links = "fb_localization_kernels"

[lints]
workspace = true

[dependencies]
contracts.workspace = true
fb-core-arena.workspace = true
fb-core-error-handling.workspace = true
fb-core-log.workspace = true
fb-core-planner.workspace = true
fb-core-thread-pool = { workspace = true, features = ["device"] }
fb-core-wwr.workspace = true
fb-kernel-abi.workspace = true
# BLAS for the operation W = S C's gemm takes.
wwr-sys = { workspace = true, features = ["blas"] }

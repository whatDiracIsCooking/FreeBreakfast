[package]
name = "fb-localization-pipek-mezey"
description = "localization/pipek_mezey: Pipek-Mezey localization of the occupied orbitals, sweeps of disjoint Jacobi rotations replayed in a loop to convergence"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
fb-basis.workspace = true
fb-core-arena.workspace = true
fb-core-error-handling.workspace = true
fb-core-planner.workspace = true
fb-core-thread-pool = { workspace = true, features = ["device"] }
fb-core-wwr.workspace = true
fb-localization-sys.workspace = true
log.workspace = true
# BLAS for the operation C U's gemm takes.
wwr-sys = { workspace = true, features = ["blas"] }

[dev-dependencies]
fb-io-basis.workspace = true
fb-io-npy.workspace = true
fb-io-xyz.workspace = true
fb-test-support.workspace = true

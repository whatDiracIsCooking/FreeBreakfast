[package]
name = "fb-tools-sad"
description = "tools/sad: free-breakfast-sad-stamps, the generator of data/sad/'s baked SAD densities"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "free-breakfast-sad-stamps"
path = "src/main.rs"

# fb-sad and not fb-io-sad: the generator is never linked against its own
# output.
[dependencies]
fb-atom.workspace = true
fb-basis.workspace = true
fb-core-error-handling.workspace = true
fb-core-thread-pool.workspace = true
fb-core-types.workspace = true
fb-io-basis.workspace = true
fb-io-npy.workspace = true
fb-sad.workspace = true
serde_json.workspace = true

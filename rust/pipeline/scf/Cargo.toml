[package]
name = "fb-pipeline-scf"
description = "pipeline/scf: the closed-shell DF-RHF loop, one iteration's tasks replayed to convergence, from the Roothaan step, the density, the Fock matrix, the energy and the DIIS residual; and the whole run from an XYZ file"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
contracts.workspace = true
fb-core-arena.workspace = true
fb-core-error-handling.workspace = true
fb-core-planner.workspace = true
fb-core-thread-pool = { workspace = true, features = ["device"] }
fb-core-wwr.workspace = true
fb-recipes-blas.workspace = true
fb-integrals-eri-density-fitting-jk.workspace = true
fb-integrals-mmd.workspace = true
fb-integrals-one-electron-core-hamiltonian.workspace = true
fb-integrals-one-electron-overlap.workspace = true
fb-io-basis.workspace = true
fb-io-xyz.workspace = true
fb-molecule.workspace = true
fb-molecule-nuclei.workspace = true
fb-pipeline-eri.workspace = true
fb-pipeline-guess.workspace = true
fb-recipes-diagonalize.workspace = true
fb-recipes-diis.workspace = true
fb-recipes-orthogonalize.workspace = true
fb-recipes-sys.workspace = true
log.workspace = true
serde.workspace = true
# BLAS for the ops the iteration's geams, gemms and gemvs take.
wwr-sys = { workspace = true, features = ["blas"] }

[dev-dependencies]
fb-io-npy.workspace = true
fb-test-support.workspace = true

# The closed-shell RHF energy of water in cc-pVDZ over the conventional
# integrals stored dense: the two unpacked matrices M_J[(mn),(ls)] = (mn|ls)
# and M_K[(mn),(ls)] = (ml|ns), with no symmetry, cut by rows over two
# devices, each holding its rows; each SCF build's J and K a broadcast of D,
# a product on each device and a gather of the pieces. Exact, shells
# through d, no AO cap but the cards' memory, which admission holds each
# card to: raise [memory] max_device_mem_per_gpu for a basis past the 8 GiB
# default. From the SAD guess. Writes scf.json, c.npy, d.npy and
# timing.json. Needs two visible devices; the binary refuses it on one.
calculation = "rhf"
output = "conventional_dense"  # relative to the working directory; default "fbf_output"
num_gpus = 2           # devices 0 and 1, over which the rows are cut; default 1

[molecule]
xyz = "water.xyz"      # Angstrom, relative to this file

[basis_set]
basis = "cc-pvdz"      # a compiled-in name, or a BSE JSON path relative to this file

[eri]                  # required: no default
mode = "conventional"  # no aux_basis: nothing is fitted
storage = "dense"      # "packed" (the default: by AO pair, on device 0) or "dense"

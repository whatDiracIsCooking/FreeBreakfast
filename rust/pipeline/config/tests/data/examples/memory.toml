# The overlap of water in cc-pVDZ, under memory caps raised from their
# defaults. Writes overlap.npy and timing.json, and logs each GPU worker's
# blocks against its caps, and the heap block against its own.
calculation = "overlap"
output = "memory"      # relative to the working directory; default "fbf_output"

[molecule]
xyz = "water.xyz"      # Angstrom, relative to this file

[basis_set]
basis = "cc-pvdz"      # a compiled-in name, or a BSE JSON path relative to this file

[memory]               # every key optional; each default is also its floor
max_device_mem_per_gpu = "10GiB"   # default "8GiB": the block and the reserve,
                                   # bounded by the card's free memory
max_pinned_mem_per_gpu = "4GiB"    # default "2GiB": the pinned block; every
                                   # worker's together within MemAvailable
max_host_mem = "32GiB"             # default "16GiB": the plan's heap block; with
                                   # the pinned blocks within MemAvailable

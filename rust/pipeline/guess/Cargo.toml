[package]
name = "fb-pipeline-guess"
description = "pipeline/guess: the initial-guess density, the SAD stamps as CPU nodes of a plan"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
fb-atom.workspace = true
fb-basis.workspace = true
fb-core-arena.workspace = true
fb-core-error-handling.workspace = true
fb-core-planner.workspace = true
fb-core-thread-pool = { workspace = true, features = ["device"] }
fb-core-wwr.workspace = true
fb-io-npy.workspace = true
fb-io-sad.workspace = true
fb-sad.workspace = true
wwr-sys.workspace = true

[dev-dependencies]
fb-core-arena = { workspace = true, features = ["test-support"] }
fb-core-types.workspace = true
fb-integrals-one-electron-overlap.workspace = true
fb-io-basis.workspace = true
fb-io-xyz.workspace = true
fb-molecule.workspace = true
fb-test-support.workspace = true

# The process's thread count around a device-free run: a plain `main`, since
# libtest's own threads would be counted.
[[test]]
name = "guess_threads"
harness = false

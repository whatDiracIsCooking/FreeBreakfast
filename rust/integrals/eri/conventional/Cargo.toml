[package]
name = "fb-integrals-eri-conventional"
description = "integrals/eri/conventional: the packed four-index ERI and its exchange-ordered gather stored once, and J and K of a density by one GEMV each; or the dense J- and K-layout matrices cut by rows over the GPU workers, J and K by a broadcast, a product per worker and a gather; as tasks"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
contracts.workspace = true
fb-basis.workspace = true
fb-core-arena.workspace = true
fb-core-error-handling.workspace = true
fb-core-planner.workspace = true
fb-core-thread-pool = { workspace = true, features = ["device"] }
fb-core-wwr.workspace = true
fb-integrals-mmd.workspace = true
fb-integrals-sys.workspace = true
fb-recipes-matrix-ao.workspace = true
fb-recipes-symmetrize.workspace = true
# The load check of the library J's and K's average launches from.
fb-recipes-sys.workspace = true
# BLAS for the gemms' and the gemvs' modes.
wwr-sys = { workspace = true, features = ["blas"] }

[dev-dependencies]
fb-io-basis.workspace = true
fb-io-npy.workspace = true
fb-io-xyz.workspace = true
fb-test-support.workspace = true

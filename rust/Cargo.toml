# free_breakfast's core rebuilt in Rust over WarpWraps' C ABI (wwr-sys): one
# crate per module, so the crate graph is the selection graph
# (docs/testing.md, "Selection: the workspace graph is the selection graph").
[workspace]
resolver = "3"
members = [
    "core/log",
    "core/error_handling",
    "core/types",
    "core/primitives",
    "core/constants",
    "atom",
    "molecule",
    "basis",
    "kernel_abi",
    "recipes/sys",
    "integrals/sys",
    "device_check",
    "io/xyz",
    "io/basis",
    "test_support",
    "doc_check",
    "sad",
    "io/npy",
    "io/sad",
    "tools/sad",
    "localization/sys",
    "core/device",
    "core/budget",
    "core/pack",
    "core/flow",
    "integrals/df_metric",
    "integrals/s_overlap_host",
    "integrals/t_kinetic_host",
    "integrals/v_potential_en_host",
    "steps",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
fb-core-log = { path = "core/log" }
fb-core-error-handling = { path = "core/error_handling" }
fb-core-types = { path = "core/types" }
fb-core-primitives = { path = "core/primitives" }
fb-core-constants = { path = "core/constants" }
fb-atom = { path = "atom" }
fb-molecule = { path = "molecule" }
fb-basis = { path = "basis" }
fb-kernel-abi = { path = "kernel_abi" }
fb-recipes-sys = { path = "recipes/sys" }
fb-io-xyz = { path = "io/xyz" }
fb-io-basis = { path = "io/basis" }
fb-integrals-sys = { path = "integrals/sys" }
fb-test-support = { path = "test_support" }
fb-sad = { path = "sad" }
fb-io-npy = { path = "io/npy" }
fb-io-sad = { path = "io/sad" }
fb-tools-sad = { path = "tools/sad" }
fb-localization-sys = { path = "localization/sys" }
fb-core-device = { path = "core/device" }
fb-core-budget = { path = "core/budget" }
fb-core-pack = { path = "core/pack" }
fb-core-flow = { path = "core/flow" }
fb-integrals-df-metric = { path = "integrals/df_metric" }
fb-integrals-s-overlap-host = { path = "integrals/s_overlap_host" }
fb-integrals-t-kinetic-host = { path = "integrals/t_kinetic_host" }
fb-integrals-v-potential-en-host = { path = "integrals/v_potential_en_host" }
fb-steps = { path = "steps" }

contracts = "0.6.11"
# core::log: the line's local time, and the OS thread id (std has none).
jiff = "0.2.43"
# doc_check: the workspace graph test reads the package graph (a
# dev-dependency only).
guppy = "0.19.1"
libc = "0.2"
# integrals/df_metric: erf for the host Boys function's far branch, which
# std lacks.
libm = "0.2.16"
# The host integral crates' shell-pair loops, on rayon's own pool
# (docs/programming_model.md, "CPU workers"); no other member names it.
rayon = "1.12"
# The executor of the v0.0.4 layer (docs/programming_model.md, "Steps on
# rustflow"). Unpublished, so a git dependency pinned by its full commit,
# here alone; a prototype under experimental/rust/, a workspace of its own,
# names the same rev (docs/testing.md, "What runs when"). fb-core-flow is
# the one member that names it (docs/programming_model.md, "CPU workers").
rustflow = { git = "https://github.com/whatDiracIsCooking/rustflow", rev = "f184bcabac5ab01dec0def8c3f369d1bbdb3bbaf" }
log = { version = "0.4.35", features = ["std"] }
proptest = "1"
# io/basis: the BSE JSON documents.
serde_json = "1"
# steps: the config file's tables, deserialized.
serde = { version = "1", features = ["derive"] }
# steps: the binary's config file.
toml = "1"
# runtime_api alone: a binary NEEDs libwwr_capi_runtime_api.so and nothing
# else of wwr's.
wwr-sys = { path = "../deps/WarpWraps/src/capi/wwr-sys", default-features = false, features = [
    "runtime_api",
] }

[workspace.lints.rust]
# Every public item carries a doc comment (docs/documentation.md,
# "Code: rustdoc"); -D warnings never reaches an allow-by-default lint.
missing_docs = "deny"

[workspace.lints.clippy]
# clippy.toml's list: spawning is core::thread_pool's alone, and a task makes
# no host sync.
disallowed_methods = "deny"
# Every unsafe block says why it holds, one operation at a time
# (docs/programming_model.md, "Capabilities are enforced by lints").
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
# A check soundness rests on is an assert! named in # Panics
# (docs/testing.md, "Contracts are part of the spec").
missing_panics_doc = "deny"
# fb-steps' clippy.toml bans vec!, the plain heap in a step's run
# (docs/memory.md, "The budget"); no other list names a macro. Not
# debug_assert!: #[debug_requires] expands to one at the caller's span, so
# clippy flags every contract. fb-doc-check's tests/contracts.rs holds that
# rule instead.
disallowed_macros = "deny"

# A release build aborts on a panic; dev and test unwind, which
# #[should_panic] needs (docs/diagnostics.md, "Panics and profiles"). Cargo
# builds every test target and its dependencies unwinding even under
# --release, so `cargo test --release` still catches its panics.
[profile.release]
panic = "abort"

# fb-sad's atomic SCF optimized in the debug build too, contracts still on:
# fb-io-sad's bitwise check of the stamps runs it for H, C and O of every
# compiled-in set, 29 s unoptimized. Rust neither contracts nor reassociates
# at any opt-level, so the bits are the same.
[profile.dev.package.fb-sad]
opt-level = 3

# free_breakfast's core rebuilt in Rust over WarpWraps' C ABI (wwr-sys): one
# crate per module, so the crate graph is the selection graph
# (docs/testing.md, "Selection: the workspace graph is the selection graph").
[workspace]
resolver = "3"
members = [
    "core/log",
    "core/error_handling",
    "core/wwr",
    "core/diagnostics",
    "core/arena",
    "core/thread_pool",
    "core/planner",
    "core/types",
    "core/primitives",
    "core/constants",
    "atom",
    "molecule",
    "basis",
    "kernel_abi",
    "recipes/sys",
    "recipes/blas",
    "integrals/sys",
    "integrals/mmd",
    "integrals/one_electron/overlap",
    "device_check",
    "io/xyz",
    "io/basis",
    "test_support",
    "doc_check",
    "sad",
    "io/npy",
    "recipes/matrix_ao",
    "io/sad",
    "integrals/one_electron/kinetic",
    "pipeline/guess",
    "molecule/nuclei",
    "integrals/one_electron/potential_en",
    "integrals/one_electron/core_hamiltonian",
    "pipeline/config",
    "tools/sad",
    "recipes/diagonalize",
    "recipes/orthogonalize",
    "pipeline/scf",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
fb-core-log = { path = "core/log" }
fb-core-error-handling = { path = "core/error_handling" }
fb-core-wwr = { path = "core/wwr" }
fb-core-diagnostics = { path = "core/diagnostics" }
# Without their `device` feature unless a dependent asks for it, so a
# device-free build of the planner pulls in no wwr.
fb-core-arena = { path = "core/arena", default-features = false }
fb-core-thread-pool = { path = "core/thread_pool", default-features = false }
fb-core-planner = { path = "core/planner" }
fb-core-types = { path = "core/types" }
fb-core-primitives = { path = "core/primitives" }
fb-core-constants = { path = "core/constants" }
fb-atom = { path = "atom" }
fb-molecule = { path = "molecule" }
fb-basis = { path = "basis" }
fb-kernel-abi = { path = "kernel_abi" }
fb-recipes-sys = { path = "recipes/sys" }
fb-recipes-blas = { path = "recipes/blas" }
fb-io-xyz = { path = "io/xyz" }
fb-io-basis = { path = "io/basis" }
fb-integrals-sys = { path = "integrals/sys" }
fb-integrals-mmd = { path = "integrals/mmd" }
fb-integrals-one-electron-overlap = { path = "integrals/one_electron/overlap" }
fb-test-support = { path = "test_support" }
fb-sad = { path = "sad" }
fb-io-npy = { path = "io/npy" }
fb-recipes-matrix-ao = { path = "recipes/matrix_ao" }
fb-io-sad = { path = "io/sad" }
fb-integrals-one-electron-kinetic = { path = "integrals/one_electron/kinetic" }
fb-pipeline-guess = { path = "pipeline/guess" }
fb-molecule-nuclei = { path = "molecule/nuclei" }
fb-integrals-one-electron-potential-en = { path = "integrals/one_electron/potential_en" }
fb-integrals-one-electron-core-hamiltonian = { path = "integrals/one_electron/core_hamiltonian" }
fb-pipeline-config = { path = "pipeline/config" }
fb-tools-sad = { path = "tools/sad" }
fb-recipes-diagonalize = { path = "recipes/diagonalize" }
fb-recipes-orthogonalize = { path = "recipes/orthogonalize" }
fb-pipeline-scf = { path = "pipeline/scf" }

contracts = "0.6.11"
# core::log: the line's local time, and the OS thread id (std has none).
jiff = "0.2.43"
libc = "0.2"
log = { version = "0.4.35", features = ["std"] }
proptest = "1"
# io/basis: the BSE JSON documents.
serde_json = "1"
# core::thread_pool: the timing record as timing.json.
serde = { version = "1", features = ["derive"] }
# pipeline/config: the binary's config file.
toml = "1"
# runtime_api alone: a binary NEEDs libwwr_capi_runtime_api.so and nothing
# else of wwr's.
wwr-sys = { path = "../deps/WarpWraps/src/capi/wwr-sys", default-features = false, features = [
    "runtime_api",
] }

[workspace.lints.rust]
# Every public item carries a doc comment (docs/documentation.md,
# "Code: rustdoc"); -D warnings never reaches an allow-by-default lint.
missing_docs = "deny"

[workspace.lints.clippy]
# clippy.toml's list: spawning is core::thread_pool's alone.
disallowed_methods = "deny"
# Every unsafe block says why it holds, one operation at a time
# (docs/programming_model.md, "Capabilities are enforced by lints").
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
# A check soundness rests on is an assert! named in # Panics
# (docs/testing.md, "Contracts are part of the spec").
missing_panics_doc = "deny"
# Not disallowed_macros for debug_assert!: #[debug_requires] expands to one
# at the caller's span, so clippy flags every contract. fb-doc-check's
# tests/contracts.rs holds that rule instead.

# A release build aborts on a panic; dev and test unwind, which
# #[should_panic] needs (docs/diagnostics.md, "Panics and profiles"). Cargo
# builds every test target and its dependencies unwinding even under
# --release, so `cargo test --release` still catches its panics.
[profile.release]
panic = "abort"

# fb-sad's atomic SCF optimized in the debug build too, contracts still on:
# fb-io-sad's bitwise check of the stamps runs it for H, C and O of every
# compiled-in set, 29 s unoptimized. Rust neither contracts nor reassociates
# at any opt-level, so the bits are the same.
[profile.dev.package.fb-sad]
opt-level = 3

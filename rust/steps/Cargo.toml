[package]
name = "fb-steps"
description = "steps: the v0.0.4 layer's MainBus (the config, setup, the dimensions counted without building an array) and every step's mem_budget and run, in one crate so the bus names every Output; and the free-breakfast binary"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
contracts.workspace = true
# The setup's geometry and bases, read and placed on the host.
fb-basis.workspace = true
fb-molecule.workspace = true
fb-io-basis.workspace = true
fb-io-xyz.workspace = true
# The guess's SAD density and its compiled-in stamps.
fb-io-sad.workspace = true
fb-sad.workspace = true
# The ledger, the buffers a step's Output owns, its lease.
fb-core-budget.workspace = true
# A step's copies and each GPU's guarded calls.
fb-core-device.workspace = true
fb-core-error-handling.workspace = true
# Steps, slots, Views and the two-mode DAG, and the executor it runs on.
fb-core-flow.workspace = true
# The value checks of the always-on contracts (eq!, le!), and the binary's
# logger and its counts.
fb-core-log.workspace = true
# check_library, before the first launch of a real run.
fb-recipes-sys.workspace = true
# The ERI step's launches: the records, the three-centre integrals and the
# gather, each with its index tables handed in on the host.
fb-integrals-sys.workspace = true
# The localization step's launches: the populations, the sweep, L.
fb-localization-sys.workspace = true
# The ERI step's warning of a batch width of one.
log.workspace = true
# The host steps' integrals, on rayon's threads: the only way to rayon
# (docs/programming_model.md, "CPU workers").
fb-integrals-s-overlap-host.workspace = true
fb-integrals-t-kinetic-host.workspace = true
fb-integrals-v-potential-en-host.workspace = true
fb-integrals-df-metric.workspace = true
# The config file.
serde.workspace = true
toml.workspace = true
# The run's products and record on disk: C and D as .npy, scf.json and
# timing.json.
fb-io-npy.workspace = true
serde_json.workspace = true

# The binary: a config through the steps, its record and products written.
[[bin]]
name = "free-breakfast"
path = "src/main.rs"

# Counts the process's threads, so no libtest harness threads beside it.
[[test]]
name = "steps_threads"
harness = false

[dev-dependencies]
# The written scf.json read back exactly, as a correctly rounding reader
# (Python's json, NumPy) reads it; and the old path's recorded energies
# (`recorded_device.rs`).
serde_json = { workspace = true, features = ["float_roundtrip"] }
# chain_vram's per-process VRAM reading on an AMD card.
fb-test-support.workspace = true
# The step-end sync's negative control (`controls_device.rs`).
fb-core-flow = { workspace = true, features = ["test-support"] }

# fb-steps' own clippy.toml, which clippy reads in place of rust/clippy.toml
# for this package: rust/clippy.toml's whole list (doc_check's
# lint_config.rs keeps this a superset of it), and the plain heap's growers
# after it. A step's `run` allocates nothing large on the plain heap
# (docs/memory.md, "The budget"): large host data is a `HeapSlab` its
# `mem_budget` makes, and every `vec!` or presized collection here is an
# `allow` naming why it is small or outside a `run` (setup, `mem_budget`,
# a test's reference). The allocation record holds what the lint cannot
# see: a library's `Vec` and a `collect` (core/flow's wrapper, in the test
# tiers).
disallowed-macros = [
  { path = "std::vec", reason = "nothing large is allocated on the plain heap in run: large host data is a HeapSlab its mem_budget makes, and small scratch an allow saying why (docs/memory.md, \"The budget\")" },
]
disallowed-methods = [
  { path = "std::thread::spawn", reason = "workers belong to rustflow's executor (core::flow), or to an all-GPU step's fan-out (core::flow::fan_out)" },
  { path = "std::thread::scope", reason = "workers belong to rustflow's executor (core::flow), or to an all-GPU step's fan-out (core::flow::fan_out)" },
  { path = "std::thread::Builder::spawn", reason = "workers belong to rustflow's executor (core::flow), or to an all-GPU step's fan-out (core::flow::fan_out)" },
  { path = "std::thread::Builder::spawn_scoped", reason = "workers belong to rustflow's executor (core::flow), or to an all-GPU step's fan-out (core::flow::fan_out)" },
  { path = "wwr_sys::wwr_launch_kernel_ex_c", reason = "Rust never launches a kernel itself: call the kernel library's C wrapper through its binding crate (docs/gpu_layer.md, \"Layering\")" },
  { path = "wwr_sys::wwr_malloc_managed", reason = "managed memory is not used (docs/memory.md, \"The three kinds\")" },
  { path = "wwr_sys::wwr_stream_attach_mem_async", reason = "managed memory is not used (docs/memory.md, \"The three kinds\")" },
  { path = "wwr_sys::wwr_mem_get_info", reason = "an adaptive width is chosen at planning, never from free memory at run time (docs/memory.md, \"Adaptive widths: one planner routine\")" },
  { path = "wwr_sys::wwr_stream_synchronize", reason = "a task has no internal host sync: a wait inside a computation is an edge, and the computation two tasks (docs/programming_model.md, \"Granularity\")" },
  { path = "wwr_sys::wwr_event_synchronize", reason = "a task has no internal host sync: a wait inside a computation is an edge, and the computation two tasks (docs/programming_model.md, \"Granularity\")" },
  { path = "wwr_sys::wwr_device_synchronize", reason = "a task has no internal host sync: a wait inside a computation is an edge, and the computation two tasks (docs/programming_model.md, \"Granularity\")" },
  { path = "wwr_sys::wwr_memcpy", reason = "a blocking copy is a host sync, and a task has none: copy on the task's stream (fb_core_device::Stream's upload, download and copy_device) and wait at an edge (docs/programming_model.md, \"Granularity\")" },
  { path = "fb_core_device::Stream::sync", reason = "a task has no internal host sync: a wait inside a computation is an edge, and the computation two tasks (docs/programming_model.md, \"Granularity\")" },
  { path = "fb_core_device::Pending::sync", reason = "a task has no internal host sync: a wait inside a computation is an edge, and the computation two tasks (docs/programming_model.md, \"Granularity\")" },
  { path = "fb_core_device::Event::sync", reason = "a task has no internal host sync: a wait inside a computation is an edge, and the computation two tasks (docs/programming_model.md, \"Granularity\")" },
  { path = "wwr_sys::wwr_malloc", reason = "device, pinned and budgeted heap memory are allocated only in mem_budget, through fb-core-budget (docs/memory.md, \"The budget\")" },
  { path = "wwr_sys::wwr_malloc_async", reason = "device, pinned and budgeted heap memory are allocated only in mem_budget, through fb-core-budget (docs/memory.md, \"The budget\")" },
  { path = "wwr_sys::wwr_malloc_from_pool_async", reason = "device, pinned and budgeted heap memory are allocated only in mem_budget, through fb-core-budget (docs/memory.md, \"The budget\")" },
  { path = "wwr_sys::wwr_malloc_pitch", reason = "device, pinned and budgeted heap memory are allocated only in mem_budget, through fb-core-budget (docs/memory.md, \"The budget\")" },
  { path = "wwr_sys::wwr_malloc_array", reason = "device, pinned and budgeted heap memory are allocated only in mem_budget, through fb-core-budget (docs/memory.md, \"The budget\")" },
  { path = "wwr_sys::wwr_host_alloc", reason = "device, pinned and budgeted heap memory are allocated only in mem_budget, through fb-core-budget (docs/memory.md, \"The budget\")" },
  { path = "wwr_sys::wwr_host_register", reason = "device, pinned and budgeted heap memory are allocated only in mem_budget, through fb-core-budget (docs/memory.md, \"The budget\")" },
  { path = "std::vec::Vec::with_capacity", reason = "nothing large is allocated on the plain heap in run: large host data is a HeapSlab its mem_budget makes, and small scratch an allow saying why (docs/memory.md, \"The budget\")" },
  { path = "std::vec::Vec::reserve", reason = "nothing large is allocated on the plain heap in run: large host data is a HeapSlab its mem_budget makes, and small scratch an allow saying why (docs/memory.md, \"The budget\")" },
  { path = "std::vec::Vec::reserve_exact", reason = "nothing large is allocated on the plain heap in run: large host data is a HeapSlab its mem_budget makes, and small scratch an allow saying why (docs/memory.md, \"The budget\")" },
  { path = "std::vec::Vec::resize", reason = "nothing large is allocated on the plain heap in run: large host data is a HeapSlab its mem_budget makes, and small scratch an allow saying why (docs/memory.md, \"The budget\")" },
  { path = "std::vec::Vec::extend_from_slice", reason = "nothing large is allocated on the plain heap in run: large host data is a HeapSlab its mem_budget makes, and small scratch an allow saying why (docs/memory.md, \"The budget\")" },
  { path = "std::string::String::with_capacity", reason = "nothing large is allocated on the plain heap in run: large host data is a HeapSlab its mem_budget makes, and small scratch an allow saying why (docs/memory.md, \"The budget\")" },
]

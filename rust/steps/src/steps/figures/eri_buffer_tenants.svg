<figure class="fb-fig">
<svg viewBox="0 0 720 388" role="img" aria-label="The tenants of one GPU's ERI buffer and of its pinned staging, at a ring of two. During eri's run each ring buffer holds its cells and its pair batch on the device, and the fitted batch and the cells of each aux momentum in pinned memory. During a J/K pass the device holds the gather weights, a copy of each density, the J and K fragments, one aux batch's work, gamma, and per ring buffer the gather tables, the packed rows and the gathered squares; pinned memory holds the host ends of D, J and K and per ring buffer the tables and the packed rows.">

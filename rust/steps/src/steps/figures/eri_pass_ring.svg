<figure class="fb-fig">
<svg viewBox="0 0 780 252" role="img" aria-label="A timeline of a J/K pass's ring on one GPU, at a ring of two, over four lanes: the host, the manager's stream 0, the GPU's stream and the manager's stream 1. The host copies an aux batch's rows of B into a ring buffer's pinned end; the upload and the gather run on that buffer's stream, after an event recorded behind the contraction that last read the buffer; the contraction runs on the GPU's stream after an event recorded behind the gather. The contractions run back to back, and each batch's copy and upload overlap an earlier batch's contraction.">
<style>.fb-fig{margin:1.2em 0}.fb-fig svg{display:block;width:100%;max-width:780px;height:auto}.fb-fig figcaption{font-size:.875em;opacity:.8;max-width:780px}.fb-fig text{font-family:"Fira Sans",Arial,Helvetica,sans-serif;font-size:12px;fill:currentColor}.fb-fig .t{font-weight:600}.fb-fig .sm{font-size:11px}.fb-fig .mt{fill-opacity:.65}.fb-fig .at{fill:var(--link-color,#3873ad)}.fb-fig .ln{stroke:currentColor;fill:none;stroke-width:1.3}.fb-fig .ml{stroke:currentColor;stroke-opacity:.45;fill:none;stroke-width:1}.fb-fig .al{stroke:var(--link-color,#3873ad);fill:none;stroke-width:1.6}.fb-fig .box{fill:var(--code-block-background-color,#f5f5f5);stroke:currentColor;stroke-width:1.2}.fb-fig .row{fill:currentColor;fill-opacity:.1;stroke:currentColor;stroke-width:1}.fb-fig .ab{fill:var(--link-color,#3873ad);fill-opacity:.18;stroke:var(--link-color,#3873ad);stroke-width:1.5}.fb-fig .ah{fill:var(--link-color,#3873ad)}.fb-fig .fh{fill:currentColor}</style>
<defs>
<marker id="eripr1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0,0L10,5L0,10z"/></marker>
<marker id="eripr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="fh" d="M0,0L10,5L0,10z"/></marker>
</defs>
<text class="t" x="10" y="18">A J/K pass's ring on one GPU, [eri] ring = 2</text>
<text class="sm mt" x="10" y="57">host</text>
<text class="sm mt" x="10" y="101">manager's stream 0</text>
<text class="sm mt" x="10" y="145">the GPU's stream</text>
<text class="sm mt" x="10" y="189">manager's stream 1</text>
<line class="ml" x1="124" y1="53" x2="770" y2="53" stroke-dasharray="2 4"/>
<line class="ml" x1="124" y1="97" x2="770" y2="97" stroke-dasharray="2 4"/>
<line class="ml" x1="124" y1="141" x2="770" y2="141" stroke-dasharray="2 4"/>
<line class="ml" x1="124" y1="185" x2="770" y2="185" stroke-dasharray="2 4"/>
<rect class="box" x="120" y="40" width="50" height="26" rx="3"/><text class="sm" x="145" y="57" text-anchor="middle">copy a</text>
<rect class="box" x="172" y="40" width="50" height="26" rx="3"/><text class="sm" x="197" y="57" text-anchor="middle">copy b</text>
<rect class="box" x="274" y="40" width="50" height="26" rx="3"/><rect class="ab" x="274" y="40" width="50" height="26" rx="3"/><text class="sm" x="299" y="57" text-anchor="middle">copy c</text>
<rect class="box" x="326" y="40" width="50" height="26" rx="3"/><text class="sm" x="351" y="57" text-anchor="middle">copy d</text>
<rect class="box" x="498" y="40" width="50" height="26" rx="3"/><text class="sm" x="523" y="57" text-anchor="middle">copy e</text>
<rect class="box" x="172" y="84" width="100" height="26" rx="3"/><text class="sm" x="222" y="101" text-anchor="middle">upload, gather a</text>
<rect class="box" x="396" y="84" width="100" height="26" rx="3"/><rect class="ab" x="396" y="84" width="100" height="26" rx="3"/><text class="sm" x="446" y="101" text-anchor="middle">upload, gather c</text>
<rect class="box" x="640" y="84" width="100" height="26" rx="3"/><text class="sm" x="690" y="101" text-anchor="middle">upload, gather e</text>
<rect class="box" x="274" y="128" width="120" height="26" rx="3"/><text class="sm" x="334" y="145" text-anchor="middle">contract a</text>
<rect class="box" x="396" y="128" width="120" height="26" rx="3"/><text class="sm" x="456" y="145" text-anchor="middle">contract b</text>
<rect class="box" x="518" y="128" width="120" height="26" rx="3"/><rect class="ab" x="518" y="128" width="120" height="26" rx="3"/><text class="sm" x="578" y="145" text-anchor="middle">contract c</text>
<rect class="box" x="640" y="128" width="120" height="26" rx="3"/><text class="sm" x="700" y="145" text-anchor="middle">contract d</text>
<rect class="box" x="224" y="172" width="100" height="26" rx="3"/><text class="sm" x="274" y="189" text-anchor="middle">upload, gather b</text>
<rect class="box" x="518" y="172" width="100" height="26" rx="3"/><text class="sm" x="568" y="189" text-anchor="middle">upload, gather d</text>
<path class="al" d="M310,67 V75 H420 V83" marker-end="url(#eripr1)"/>
<line class="al" x1="388" y1="127" x2="402" y2="111" marker-end="url(#eripr1)"/>
<text class="sm at" x="384" y="123" text-anchor="end">event: contracted</text>
<line class="al" x1="490" y1="111" x2="524" y2="127" marker-end="url(#eripr1)"/>
<text class="sm at" x="532" y="123">event: gathered</text>
<line class="ln" x1="120" y1="218" x2="762" y2="218" marker-end="url(#eripr2)"/>
<text class="sm mt" x="770" y="236" text-anchor="end">time</text>
<text class="sm mt" x="120" y="236">a to e: one GPU's aux batches in order. Batch c's chain is marked; every batch's is the same.</text>
</svg>
<figcaption>The host copy and the upload of batch c run while batches a and b are contracted, so the contractions run back to back on the GPU's stream. Batch c takes the ring buffer batch a used: its copy waits for a's upload, and its upload for a's contraction.</figcaption>
</figure>

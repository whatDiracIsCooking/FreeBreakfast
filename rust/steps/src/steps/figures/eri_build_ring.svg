<figcaption>Kernels on a ring buffer's stream, the fit on the GPU's stream, the download back on the ring buffer's stream, the scatter on the host: batch b's kernels run while batch a is fitted, and the host writes batch c's cells while b is fitted and downloaded.</figcaption>

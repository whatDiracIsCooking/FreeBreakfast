# Spawning belongs to rustflow's executor and to an all-GPU step's fan-out:
# core/flow/src/fan_out.rs is the module with the allow (docs/programming_model.md, "Capabilities are enforced by
# lints"). rustflow's executor spawns its own workers, out of clippy's sight;
# the workspace graph holds it to fb-core-flow (doc_check's
# workspace_graph.rs).
#
# The wwr-sys entries are the GPU rules (docs/rules.md): a kernel launch goes
# through its kernel library's C wrapper, managed memory is not used, and
# free memory is read only for a defaulted cap and an allocation's refusal,
# never to size work at run time. Each allowed site names its exception.
#
# The sync entries hold the step rule: a step's run has no internal host
# sync, so a wait inside a computation is an edge (docs/programming_model.md,
# "Granularity"). The step wrapper's sync after `run` (fb-core-device), a
# manager's ring wait and a step reading a solver's flag after its last
# enqueue are the allowed sites, beside a destroy and a test, each with its
# reason.
#
# The raw allocators are fb-core-budget's alone: device, pinned and budgeted
# heap memory is allocated in `mem_budget`, through a `Budget`
# (docs/memory.md, "The budget"). The tests' own buffers are the other
# allowed sites, each with its reason.
#
# rust/steps/clippy.toml is fb-steps' own copy of this list, with the heap
# growers added (doc_check's lint_config.rs keeps it a superset).
disallowed-methods = [
  { path = "std::thread::spawn", reason = "workers belong to rustflow's executor (core::flow), or to an all-GPU step's fan-out (core::flow::fan_out)" },
  { path = "std::thread::scope", reason = "workers belong to rustflow's executor (core::flow), or to an all-GPU step's fan-out (core::flow::fan_out)" },
  { path = "std::thread::Builder::spawn", reason = "workers belong to rustflow's executor (core::flow), or to an all-GPU step's fan-out (core::flow::fan_out)" },
  { path = "std::thread::Builder::spawn_scoped", reason = "workers belong to rustflow's executor (core::flow), or to an all-GPU step's fan-out (core::flow::fan_out)" },
  { path = "wwr_sys::wwr_launch_kernel_ex_c", reason = "Rust never launches a kernel itself: call the kernel library's C wrapper through its binding crate (docs/gpu_layer.md, \"Layering\")" },
  { path = "wwr_sys::wwr_malloc_managed", reason = "managed memory is not used (docs/memory.md, \"The budget\")" },
  { path = "wwr_sys::wwr_stream_attach_mem_async", reason = "managed memory is not used (docs/memory.md, \"The budget\")" },
  { path = "wwr_sys::wwr_mem_get_info", reason = "a batch width is chosen in mem_budget from the step's own limit, never from free memory at run time (docs/memory.md, \"Batched only\")" },
  { path = "wwr_sys::wwr_stream_synchronize", reason = "a step's run has no internal host sync: a wait inside a computation is an edge, and the computation two steps (docs/programming_model.md, \"Granularity\")" },
  { path = "wwr_sys::wwr_event_synchronize", reason = "a step's run has no internal host sync: a wait inside a computation is an edge, and the computation two steps (docs/programming_model.md, \"Granularity\")" },
  { path = "wwr_sys::wwr_device_synchronize", reason = "a step's run has no internal host sync: a wait inside a computation is an edge, and the computation two steps (docs/programming_model.md, \"Granularity\")" },
  { path = "wwr_sys::wwr_memcpy", reason = "a blocking copy is a host sync, and a step's run has none: copy on the step's stream (fb_core_device::Stream's upload, download and copy_device) and wait at an edge (docs/programming_model.md, \"Granularity\")" },
  { path = "fb_core_device::Stream::sync", reason = "a step's run has no internal host sync: a wait inside a computation is an edge, and the computation two steps (docs/programming_model.md, \"Granularity\")" },
  { path = "fb_core_device::Pending::sync", reason = "a step's run has no internal host sync: a wait inside a computation is an edge, and the computation two steps (docs/programming_model.md, \"Granularity\")" },
  { path = "fb_core_device::Event::sync", reason = "a step's run has no internal host sync: a wait inside a computation is an edge, and the computation two steps (docs/programming_model.md, \"Granularity\")" },
  { path = "wwr_sys::wwr_malloc", reason = "device, pinned and budgeted heap memory are allocated only in mem_budget, through fb-core-budget (docs/memory.md, \"The budget\")" },
  { path = "wwr_sys::wwr_malloc_async", reason = "device, pinned and budgeted heap memory are allocated only in mem_budget, through fb-core-budget (docs/memory.md, \"The budget\")" },
  { path = "wwr_sys::wwr_malloc_from_pool_async", reason = "device, pinned and budgeted heap memory are allocated only in mem_budget, through fb-core-budget (docs/memory.md, \"The budget\")" },
  { path = "wwr_sys::wwr_malloc_pitch", reason = "device, pinned and budgeted heap memory are allocated only in mem_budget, through fb-core-budget (docs/memory.md, \"The budget\")" },
  { path = "wwr_sys::wwr_malloc_array", reason = "device, pinned and budgeted heap memory are allocated only in mem_budget, through fb-core-budget (docs/memory.md, \"The budget\")" },
  { path = "wwr_sys::wwr_host_alloc", reason = "device, pinned and budgeted heap memory are allocated only in mem_budget, through fb-core-budget (docs/memory.md, \"The budget\")" },
  { path = "wwr_sys::wwr_host_register", reason = "device, pinned and budgeted heap memory are allocated only in mem_budget, through fb-core-budget (docs/memory.md, \"The budget\")" },
]

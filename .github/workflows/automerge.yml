# Server-side auto-merge, the free-plan stand-in for GitHub's own auto-merge
# (which is paywalled for private repos on GitHub Free).
#
# WHAT IT DOES
#   When the `ci` workflow finishes SUCCESSFULLY for a pull request, this looks
#   for an open PR on that branch carrying the `automerge` label and squash-
#   merges it, deleting the branch. Nothing merges unless it is BOTH green and
#   explicitly labelled -- the label is the opt-in, per PR.
#
# WHY workflow_run
#   It fires on the *conclusion* of `ci`, so "green" is already decided by the
#   time this runs -- no polling, no racing the checks. `workflow_run` also runs
#   from the default branch's copy of this file with a real GITHUB_TOKEN, which
#   a `pull_request`-triggered job would not get for that purpose.
#
# THE MERGE IS SERVER-SIDE
#   It happens here, on GitHub's runner, with GITHUB_TOKEN -- never through an
#   agent's local permission prompt. The agent's whole role is one labelled
#   command when it opens the PR: `gh pr edit <n> --add-label automerge`.
#
# CAVEATS
#   - A GITHUB_TOKEN merge does NOT re-trigger workflows; fine for merging, but
#     do not build a chain that depends on it.
#   - If branch protection ever requires a human review, GITHUB_TOKEN cannot
#     satisfy it and the merge step fails loudly rather than merging.
name: automerge

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]

# Least privilege: enough to read the PR and merge it, nothing more.
permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    # Only a green CI run that was itself triggered by a pull request.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Merge green, labelled PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open \
                 --json number,labels \
                 --jq 'map(select(any(.labels[]; .name == "automerge")))
                       | .[0].number // empty')
          if [ -z "$pr" ]; then
            echo "No open PR labelled 'automerge' on branch '$BRANCH'; nothing to do."
            exit 0
          fi
          echo "Merging PR #$pr (branch '$BRANCH', CI green)."
          gh pr merge "$pr" --repo "$REPO" --squash --delete-branch
# Verified end-to-end by a labelled smoke-test PR that this workflow merged itself.

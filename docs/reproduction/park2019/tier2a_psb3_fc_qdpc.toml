# Tier 2a (#848): PSB3's Franck-Condon geometry, the minimum of QD state 0 of
# Park's SA-QD-PC-NEVPT2 over DF-SA3-CASSCF(6,6)/cc-pVDZ (cc-pVDZ-JKFIT), from
# his own S0 (psb3_fc_start.xyz, his SI converted to Angstrom). The FC geometry
# the 13-14 MECI's elongation is measured against, at the MECI's own level.
# Its final.xyz is psb3_fc_ccpvdz.xyz. The six pi orbitals are named by index
# at this start (tier2a.md, "The active space"). Run from the root of the tree:
#   build/src/free-breakfast -i docs/reproduction/park2019 -o <out> \
#     docs/reproduction/park2019/tier2a_psb3_fc_qdpc.toml
[molecule]
xyz = "geometries/psb3_fc_start.xyz"
charge = 1
[basis_set]
basis = "cc-pvdz"
[eri]
mode = "density_fitting"
aux_basis = "cc-pvdz-jkfit"
[scf]
max_iterations = 400
[casscf]
ncas = 6
nelecas = 6
active = [18, 20, 21, 22, 23, 28]   # the RHF's six pi orbitals, 0-based
nroots = 3
conv_tol_grad = 1e-9                # as the MECI's (#867)
[nevpt2_gradient]
quasi_degenerate = true
variant = "pc"
state = 0
[optimize]
max_force = 1.5e-5                  # Opt=Tight, as the MECI's
rms_force = 1e-5
max_displacement = 6e-5
rms_displacement = 4e-5
max_steps = 200

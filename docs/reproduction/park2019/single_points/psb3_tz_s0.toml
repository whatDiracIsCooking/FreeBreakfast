# Issue #860 phase 1: PSB3 S0, SA3-QD-NEVPT2 single point at
# Park's geometry (J. W. Park, JCTC (2020), acs.jctc.9b00919, Supporting Information, p. S12).
# His QD-NEVPT2 E(0, 1, 2): -249.2912816246, -249.1355139022, -249.0850239583 Eh.
# All-electron here (he froze the core); see README.md.
[molecule]
xyz = "geometries/psb3_tz_s0.xyz"
charge = 1
[basis_set]
basis = "cc-pvtz"
[eri]
mode = "density_fitting"
aux_basis = "cc-pvtz-jkfit"
[scf]
max_iterations = 400
[casscf]
ncas = 6
nelecas = 6
active = [18, 20, 21, 22, 25, 29]  # 0-based RHF MOs of pi character (README.md, "Active spaces")
nroots = 3
conv_tol_grad = 1e-9  # #867: 1e-10 can stall at PSB3
[nevpt2]
quasi_degenerate = true

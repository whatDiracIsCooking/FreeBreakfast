# Issue #860 phase 2 (frozen core, #859): ethylene Py, SA3-QD-NEVPT2 single point at
# Park's geometry (J. W. Park, JCTC (2020), acs.jctc.9b00919, Supporting Information, p. S2).
# His QD-NEVPT2 E(0, 1, 2): -78.1717632797, -78.1717565966, -78.0067566825 Eh.
# Frozen core, as his: the C and N 1s (frozen_core = "auto"). This is
# ethylene_adz_py.toml with that one line appended; results in frozen_core.md.
[molecule]
xyz = "geometries/ethylene_adz_py.xyz"
[basis_set]
basis = "aug-cc-pvdz"
[eri]
mode = "density_fitting"
aux_basis = "aug-cc-pvdz-jkfit"
[scf]
max_iterations = 400
[casscf]
ncas = 2
nelecas = 2
nroots = 3
conv_tol_grad = 1e-10
[nevpt2]
quasi_degenerate = true
frozen_core = "auto"

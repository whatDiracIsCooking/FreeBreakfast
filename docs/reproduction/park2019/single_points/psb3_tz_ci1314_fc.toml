# Issue #860 phase 2 (frozen core, #859): PSB3 13-14 CI, SA3-QD-NEVPT2 single point at
# Park's geometry (J. W. Park, JCTC (2020), acs.jctc.9b00919, Supporting Information, p. S14).
# His QD-NEVPT2 E(0, 1, 2): -249.1754770559, -249.1754702166, -249.0514189025 Eh.
# Frozen core, as his: the C and N 1s (frozen_core = "auto"). This is
# psb3_tz_ci1314.toml with that one line appended; results in frozen_core.md.
[molecule]
xyz = "geometries/psb3_tz_ci1314.xyz"
charge = 1
[basis_set]
basis = "cc-pvtz"
[eri]
mode = "density_fitting"
aux_basis = "cc-pvtz-jkfit"
[scf]
max_iterations = 400
[casscf]
ncas = 6
nelecas = 6
active = [19, 20, 21, 22, 23, 27]  # 0-based RHF MOs of pi character (README.md, "Active spaces")
nroots = 3
conv_tol_grad = 1e-9  # as recorded; 1e-10 stalled before #867 (fixed in PR #896)
[nevpt2]
quasi_degenerate = true
frozen_core = "auto"

# Issue #860 phase 1: ethylene Hm, SA3-QD-NEVPT2 single point at
# Park's geometry (J. W. Park, JCTC (2020), acs.jctc.9b00919, Supporting Information, p. S4).
# His QD-NEVPT2 E(0, 1, 2): -78.1468050753, -78.1467695461, -78.0301994581 Eh.
# All-electron here (he froze the core); see README.md.
[molecule]
xyz = "geometries/ethylene_adz_hm.xyz"
[basis_set]
basis = "aug-cc-pvdz"
[eri]
mode = "density_fitting"
aux_basis = "aug-cc-pvdz-jkfit"
[scf]
max_iterations = 400
[casscf]
ncas = 2
nelecas = 2
nroots = 3
conv_tol_grad = 1e-10
[nevpt2]
quasi_degenerate = true

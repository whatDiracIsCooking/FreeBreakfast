# Issue #904: pHBI S0 minimum, (14e,12o)/cc-pVTZ, SA2-QD-NEVPT2 single point at Park's geometry
# (J. W. Park, JCTC (2020), acs.jctc.9b00919, Supporting Information, pp. S34–S35).
# His QD-NEVPT2 E(0, 1): -644.0636384427, -643.9566790714 Eh.
# Frozen core, as his: the C, N and O 1s (frozen_core = "auto"). The anion
# (phenoxide), so charge = -1: 98 electrons. Results in ../phbi.md.
# NOT his space: this all-pi (14e,12o) misses him by +0.53 / +1.78 mEh, and
# so do the two other all-pi choices tried (../phbi.md, "(14e,12o)"). Kept as
# the record of what was run, not as a reproduction.
[molecule]
xyz = "geometries/phbi_tz1412_s0.xyz"
charge = -1
[basis_set]
basis = "cc-pvtz"
[eri]
mode = "density_fitting"
aux_basis = "cc-pvtz-jkfit"
[scf]
max_iterations = 400
[casscf]
ncas = 12
nelecas = 14
active = [37, 39, 42, 43, 46, 47, 48, 49, 53, 55, 57, 62]  # 0-based RHF MOs of pi character; not his (14e,12o)
nroots = 2
conv_tol_grad = 1e-9
[nevpt2]
quasi_degenerate = true
frozen_core = "auto"

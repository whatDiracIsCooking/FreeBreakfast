# Issue #904: pHBI I-twisted MECI, (4e,3o)/cc-pVTZ, SA2-QD-NEVPT2 single point at Park's geometry
# (J. W. Park, JCTC (2020), acs.jctc.9b00919, Supporting Information, pp. S25–S26).
# His QD-NEVPT2 E(0, 1): -643.9637393315, -643.9637230351 Eh.
# Frozen core, as his: the C, N and O 1s (frozen_core = "auto"). The anion
# (phenoxide), so charge = -1: 98 electrons. Results in ../phbi.md.
[molecule]
xyz = "geometries/phbi_tz43_itw.xyz"
charge = -1
[basis_set]
basis = "cc-pvtz"
[eri]
mode = "density_fitting"
aux_basis = "cc-pvtz-jkfit"
[scf]
max_iterations = 400
[casscf]
ncas = 3
nelecas = 4
active = [47, 48, 49]  # 0-based RHF MOs of pi character (../phbi.md, "Active spaces")
nroots = 2
conv_tol_grad = 1e-9
[nevpt2]
quasi_degenerate = true
frozen_core = "auto"

# Issue #860 phase 1: PSB3 S1, SA3-QD-NEVPT2 single point at
# Park's geometry (J. W. Park, JCTC (2020), acs.jctc.9b00919, Supporting Information, p. S12).
# His QD-NEVPT2 E(0, 1, 2): -249.2840999522, -249.1416654535, -249.1001758879 Eh.
# All-electron here (he froze the core); see README.md.
[molecule]
xyz = "geometries/psb3_tz_s1.xyz"
charge = 1
[basis_set]
basis = "cc-pvtz"
[eri]
mode = "density_fitting"
aux_basis = "cc-pvtz-jkfit"
[scf]
max_iterations = 400
[casscf]
ncas = 6
nelecas = 6
active = [18, 20, 21, 22, 25, 28]  # 0-based RHF MOs of pi character (README.md, "Active spaces")
nroots = 3
conv_tol_grad = 1e-9  # as recorded; 1e-10 stalled before #867 (fixed in PR #896)
[nevpt2]
quasi_degenerate = true

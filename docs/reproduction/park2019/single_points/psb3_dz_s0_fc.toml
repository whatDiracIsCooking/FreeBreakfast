# Issue #860 phase 2 (frozen core, #859): PSB3 S0, SA3-QD-NEVPT2 single point at
# Park's geometry (J. W. Park, JCTC (2020), acs.jctc.9b00919, Supporting Information, p. S8).
# His QD-NEVPT2 E(0, 1, 2): -249.0491104000, -248.8930991441, -248.8451138449 Eh.
# Frozen core, as his: the C and N 1s (frozen_core = "auto"). This is
# psb3_dz_s0.toml with that one line appended; results in frozen_core.md.
[molecule]
xyz = "geometries/psb3_dz_s0.xyz"
charge = 1
[basis_set]
basis = "cc-pvdz"
[eri]
mode = "density_fitting"
aux_basis = "cc-pvdz-jkfit"
[scf]
max_iterations = 400
[casscf]
ncas = 6
nelecas = 6
active = [18, 20, 21, 22, 23, 28]  # 0-based RHF MOs of pi character (README.md, "Active spaces")
nroots = 3
conv_tol_grad = 1e-9  # as recorded; 1e-10 stalled before #867 (fixed in PR #896)
[nevpt2]
quasi_degenerate = true
frozen_core = "auto"

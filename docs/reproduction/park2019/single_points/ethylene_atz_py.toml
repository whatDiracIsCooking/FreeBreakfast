# Issue #860 phase 1: ethylene Py, SA3-QD-NEVPT2 single point at
# Park's geometry (J. W. Park, JCTC (2020), acs.jctc.9b00919, Supporting Information, p. S5).
# His QD-NEVPT2 E(0, 1, 2): -78.2456878972, -78.2456869971, -78.0842111737 Eh.
# All-electron here (he froze the core); see README.md.
[molecule]
xyz = "geometries/ethylene_atz_py.xyz"
[basis_set]
basis = "aug-cc-pvtz"
[eri]
mode = "density_fitting"
aux_basis = "aug-cc-pvtz-jkfit"
[scf]
max_iterations = 400
[casscf]
ncas = 2
nelecas = 2
nroots = 3
conv_tol_grad = 1e-10
[nevpt2]
quasi_degenerate = true

# Tier 2a (#848): PSB3's 13-14CI, the MECI of QD states 0 and 1 of Park's
# SA-QD-PC-NEVPT2 over DF-SA3-CASSCF(6,6)/cc-pVDZ (cc-pVDZ-JKFIT), from his
# own 13-14 CI (psb3_1314_start.xyz, his SI converted to Angstrom). At that
# start the RHF's six frontier orbitals, 19-24, are the pi set (tier2a.md,
# "The active space"), so none is named. A PC refusal at any geometry stops
# the walk, so a converged walk is the statement that PC was refused at none.
# Its final.xyz is psb3_1314_meci_ccpvdz.xyz. Run from the root of the tree:
#   build/src/free-breakfast -i docs/reproduction/park2019 -o <out> \
#     docs/reproduction/park2019/tier2a_psb3_1314_qdpc.toml
[molecule]
xyz = "geometries/psb3_1314_start.xyz"
charge = 1
[basis_set]
basis = "cc-pvdz"
[eri]
mode = "density_fitting"
aux_basis = "cc-pvdz-jkfit"
[scf]
max_iterations = 400
[casscf]
ncas = 6
nelecas = 6
nroots = 3
conv_tol_grad = 1e-9  # as recorded; 1e-10 stalled before #867 (fixed in PR #896)
[nevpt2_gradient]
quasi_degenerate = true
variant = "pc"             # Park's SA-QD-PC-NEVPT2
[optimize]
meci = [0, 1]
max_gap = 1e-7
max_force = 1.5e-5
rms_force = 1e-5
max_displacement = 6e-5
rms_displacement = 4e-5
max_steps = 300

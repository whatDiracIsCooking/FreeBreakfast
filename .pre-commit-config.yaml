# Two stages, deliberately different in cost:
#
#   commit: lint only, and only on the files you actually staged. pre-commit
#           passes staged files to a hook, so a tree with pre-existing findings
#           does not block every commit -- only files you touch are checked.
#   push:   two test gates, each fired only by the file type it covers -- the
#           fast Python tier (devtools/prepush-tests.sh) on a .py change, and
#           the C++ smoke gate (devtools/cpp-smoke.sh) on a C++/build change.
#
# No hook REWRITES a file. A formatter run as a hook rewrites whole files
# behind your back and buries the real diff in restyling. The format is still
# enforced, by CHECKING: the `format` hook below runs devtools/format.sh --check
# (clang-format and ruff format, the versions uv.lock pins) on the staged files
# and fails on drift; you run devtools/format.sh to fix, and see the diff
# before committing it. CI's `lint` job runs the same check over the tree.
# cmake-format is not part of it -- cmake-lint covers CMake. docs/style.md has
# the parts of the style no tool checks.
#
# The C++ push gate is a SMOKE gate, not the full tier, and that distinction is
# the whole point. A full C++23 named-module build plus every reference test
# costs minutes even warm -- a single end-to-end validation case can run to
# minutes on its own -- and a gate that costs minutes is one people bypass with
# --no-verify -- worse than no gate. So devtools/cpp-smoke.sh does the cheap
# half: an INCREMENTAL build (the host/gpu test split made it seconds warm,
# ~1min cold) plus the host tests and a GPU smoke, with the heavy reference
# cases skipped via FREE_BREAKFAST_FAST_TESTS. The FULL tier
# (devtools/cpp-tier.sh, every case) stays off the push path, run before you
# open the PR and by CI on a runner that has the toolchain -- same reasoning
# that keeps `-m slow` off the Python gate.

# deps/WarpWraps is a submodule -- its own hooks are its repository's business,
# and rewriting files in there would show up as submodule drift.
exclude: '^(vendor/|third_party/|deps/WarpWraps/)'

# `pre-commit install` installs BOTH hook types from this list, so one install
# wires up the commit-time lint and the pre-push gate. The hook bakes an
# absolute python path into .git/hooks/ and lives in the COMMON git dir --
# shared by the main checkout and every worktree -- so installing it from
# inside a container breaks host-side commits and vice versa. Symptom:
# "ModuleNotFoundError: No module named 'pre_commit'". Fix with
# `pre-commit install -f` from whichever side you commit on.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.2
    hooks:
      - id: ruff-check
        args: [--fix]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        # 3 MB rather than the 500 kB default: a generated device kernel can
        # legitimately run to a couple of MB of source, and such a file is
        # usually not splittable without the next regeneration re-merging it.
        # Still low enough to catch an errant blob or dataset committed by
        # accident, which is what this hook is actually for.
        args: [--maxkb=3072]

  # cmake-lint on the staged cmake files. A linter, not a formatter -- the
  # rule above bans tools that rewrite whole files, and this one only reports.
  # Without it cmake-lint ran in CI and nowhere else, which is how a rename
  # that outgrew line_width reached the server before anyone saw it.
  # devtools/cmake-lint.sh resolves cmakelang through VENV_PATHS, because
  # .venv/bin is not on PATH on the host.
  - repo: local
    hooks:
      - id: cmake-lint
        name: cmake-lint (staged CMakeLists.txt and *.cmake)
        entry: devtools/cmake-lint.sh
        language: script
        files: '(^|/)CMakeLists\.txt$|\.cmake$'

  # Formatting, checked not applied -- see the header. devtools/format.sh
  # resolves both tools through VENV_PATHS, like cmake-lint above, so it runs
  # the uv.lock versions on the host and in the image alike.
  - repo: local
    hooks:
      - id: format
        name: format check (clang-format, ruff format; staged files)
        entry: devtools/format.sh --check
        language: script
        files: '\.(cppm|cpp|cu|cuh|h|hpp|py)$'

  # The fast test gate. `stages: [pre-push]` means it runs at `git push`, not
  # on commit; `files: \.py$` is the entire "only when Python changed"
  # condition -- push a docs-only change and it does not fire.
  # pass_filenames: false because the script runs the curated set from
  # devtools/config.sh, not the changed files. Bypass a one-off with
  # `git push --no-verify`. It is a local gate, not server-enforced -- CI is.
  - repo: local
    hooks:
      - id: prepush-tests
        name: fast test gate (pre-push, only when .py changed)
        entry: devtools/prepush-tests.sh
        language: script
        stages: [pre-push]
        files: \.py$
        pass_filenames: false
        verbose: true

      # The C++ smoke gate -- the Python gate's counterpart for C++. `files:`
      # fires it only when a push touches C++ sources or the build files;
      # devtools/cpp-smoke.sh does an incremental build + the host tests + a GPU
      # smoke (the heavy end-to-end reference cases skip via
      # FREE_BREAKFAST_FAST_TESTS). It SKIPS itself -- not the push --
      # when the toolchain or a GPU is absent, so a host-side push is not forced
      # onto --no-verify; see the script header. This deliberately revises the
      # old "no C++ build on the push gate" stance: the host/gpu test split made
      # the build cheap and the fast subset ~5s, so the gate is worth its
      # seconds now. Bypass a one-off with `git push --no-verify`.
      - id: cpp-smoke
        name: C++ smoke gate (pre-push, only when C++ changed)
        entry: devtools/cpp-smoke.sh
        language: script
        stages: [pre-push]
        files: '\.(cpp|cppm|cu|cuh|h|hpp)$|(^|/)CMakeLists\.txt$|(^|/)CMakePresets\.json$|\.cmake$'
        pass_filenames: false
        verbose: true

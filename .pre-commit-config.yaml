# Two stages, deliberately different in cost:
#
#   commit: lint only, and only on the files you actually staged. pre-commit
#           passes staged files to a hook, so a tree with pre-existing findings
#           does not block every commit -- only files you touch are checked.
#   push:   one test gate, devtools/test.py push. It reads the pushed range
#           itself and runs the fast Python tier when a .py changed and the
#           C++ smoke when C++ or a build file did (docs/testing.md "Gates").
#
# No hook REWRITES a file. A formatter run as a hook rewrites whole files
# behind your back and buries the real diff in restyling. The format is still
# enforced, by CHECKING: the `format` hook below runs devtools/format.sh --check
# (clang-format and ruff format, the versions uv.lock pins) on the staged files
# and fails on drift; you run devtools/format.sh to fix, and see the diff
# before committing it. CI's `lint` job runs the same check over the tree.
# cmake-format is not part of it -- cmake-lint covers CMake. docs/style.md has
# the parts of the style no tool checks.
#
# The C++ half of the push gate is a SMOKE gate, not the PR gate, and that
# distinction is the whole point. A full C++23 named-module build plus every
# reference test costs minutes even warm, and a gate that costs minutes is one
# people bypass with --no-verify -- worse than no gate. So `test.py push` does
# the cheap half: an INCREMENTAL build plus the host tests and a GPU smoke,
# with the heavy reference cases skipped via FREE_BREAKFAST_FAST_TESTS.
# `devtools/test.py pr` stays off the push path, run before you open the PR --
# same reasoning that keeps `-m slow` off the Python half.

# deps/WarpWraps and deps/FelizJueves are submodules -- their own hooks are
# their repositories' business, and rewriting files in there would show up as
# submodule drift.
exclude: '^(vendor/|third_party/|deps/WarpWraps/|deps/FelizJueves/)'

# `pre-commit install` installs BOTH hook types from this list, so one install
# wires up the commit-time lint and the pre-push gate. The hook bakes an
# absolute python path into .git/hooks/ and lives in the COMMON git dir --
# shared by the main checkout and every worktree -- so installing it from
# inside a container breaks host-side commits and vice versa. Symptom:
# "ModuleNotFoundError: No module named 'pre_commit'". Fix with
# `pre-commit install -f` from whichever side you commit on.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.2
    hooks:
      - id: ruff-check
        args: [--fix]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        # 3 MB rather than the 500 kB default: a generated device kernel can
        # legitimately run to a couple of MB of source, and such a file is
        # usually not splittable without the next regeneration re-merging it.
        # Still low enough to catch an errant blob or dataset committed by
        # accident, which is what this hook is actually for.
        args: [--maxkb=3072]
        # The 3-RDM experiment's dm3, f3ca and f3ac are n_act^6 doubles, 8 MB
        # each at CAS(10,10), and the data is the point of that directory.
        exclude: ^experimental/compress_rdm3/

  # cmake-lint on the staged cmake files. A linter, not a formatter -- the
  # rule above bans tools that rewrite whole files, and this one only reports.
  # Without it cmake-lint ran in CI and nowhere else, which is how a rename
  # that outgrew line_width reached the server before anyone saw it.
  # devtools/cmake-lint.sh resolves cmakelang through VENV_PATHS, because
  # .venv/bin is not on PATH on the host.
  - repo: local
    hooks:
      - id: cmake-lint
        name: cmake-lint (staged CMakeLists.txt and *.cmake)
        entry: devtools/cmake-lint.sh
        language: script
        files: '(^|/)CMakeLists\.txt$|\.cmake$'

  # Formatting, checked not applied -- see the header. devtools/format.sh
  # resolves both tools through VENV_PATHS, like cmake-lint above, so it runs
  # the uv.lock versions on the host and in the image alike.
  - repo: local
    hooks:
      - id: format
        name: format check (clang-format, ruff format; staged files)
        entry: devtools/format.sh --check
        language: script
        files: '\.(cppm|cpp|cu|cuh|h|hpp|py)$'

  # Fixed-width integer types only -- docs/style.md "Integer types". A checker,
  # not a fixer: clang-tidy is advisory here and its google-runtime-int does not
  # flag plain `int`, so this script is what holds the rule. Stdlib-only
  # Python, so it needs nothing from the venv.
  - repo: local
    hooks:
      - id: int-types
        name: fixed-width integer types (staged C++)
        entry: devtools/check-int-types.py
        language: script
        files: '\.(cppm|cpp|cu|cuh|h|hpp)$'

  # Statically sized shared memory -- docs/style.md "Shared memory". Flags
  # `extern __shared__` without a `dynamic-smem-ok:` reason. Stdlib-only, like
  # int-types, whose comment/literal blanking it reuses.
  - repo: local
    hooks:
      - id: shared-mem
        name: static shared memory (staged device code)
        entry: devtools/check-shared-mem.py
        language: script
        files: '\.(cu|cuh|h|hpp)$'

  # No hand-written ceiling division -- docs/style.md "Launch shape and integer
  # rounding". Flags `(n + b - 1) / b`; math::idivup is the spelling.
  # Stdlib-only, reusing int-types' comment/literal blanking.
  - repo: local
    hooks:
      - id: ceil-div
        name: no hand-written ceiling division (staged C++)
        entry: devtools/check-ceil-div.py
        language: script
        files: '\.(cppm|cpp|cu|cuh|h|hpp)$'

  # No blocking host-device copy -- docs/style.md "Host-device copies". Flags
  # `wwrMemcpy(` / `wwrMemcpy2D(`; wwrMemcpyAsync on res.stream() is the
  # spelling. Stdlib-only, reusing int-types' comment/literal blanking.
  - repo: local
    hooks:
      - id: blocking-memcpy
        name: no blocking wwrMemcpy (staged C++)
        entry: devtools/check-blocking-memcpy.py
        language: script
        files: '\.(cppm|cpp|cu|cuh|h|hpp)$'

  # Allocation the pool cap cannot see -- docs/style.md "Allocations go through
  # the pool". Flags a raw wwrMalloc* / cudaMalloc* / hipMalloc*, pinned memory
  # outside src/core/, and wwrMemGetInfo past its allowlist. Staging the
  # allowlist checks the whole of src/. Stdlib-only, reusing int-types'
  # comment/literal blanking.
  - repo: local
    hooks:
      - id: pool-bypass
        name: allocations go through the pool (staged src/)
        entry: devtools/alloc-sites.py check
        language: script
        files: '^(src/.*\.(cppm|cpp|cu|cuh|h|hpp)|devtools/alloc-sites-memgetinfo\.txt)$'

  # The push gate. `stages: [pre-push]` means it runs at `git push`, not on
  # commit. It always runs and decides for itself what to test: pre-commit
  # exports the pushed range as PRE_COMMIT_FROM_REF/PRE_COMMIT_TO_REF, and
  # test.py diffs it, so the dispatch -- the Python half on a .py change, the
  # C++ half on a source, header or CMake change, nothing on a docs-only push
  # -- lives in one place. A `files:` filter here would be a second copy of
  # it, and pass_filenames would let pre-commit split a long file list over
  # several runs of the gate. The C++ half SKIPS itself -- not the push --
  # when the toolchain or a GPU is absent, so a host-side push is not forced
  # onto --no-verify. Bypass a one-off with `git push --no-verify`. It is a
  # local gate, not server-enforced.
  - repo: local
    hooks:
      - id: test-push
        name: push gate (devtools/test.py push)
        entry: devtools/test.py push
        language: script
        stages: [pre-push]
        always_run: true
        pass_filenames: false
        verbose: true
